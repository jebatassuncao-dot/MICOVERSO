<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Micoverso Amazônico</title>
<meta name="description" content="Aplicativo educacional sobre fungos amazônicos para o 1º ano do Ensino Médio.">
<meta name="theme-color" content="#1E6A5A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Micoverso">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;700&display=swap">
<style>
/* Layout: app de coluna única tipo celular — cabeçalho fino, conteúdo rolável, barra de abas; folhas (sheets) sobrepostas para encontros, fichas e formulários */
:root{
  --bg:#EDEFE4; --surface:#F9FAF3; --surface2:#E1E6D3; --ink:#2A2117; --muted:#5C5647; --line:#C6CCB5;
  --accent:#1E6A5A; --accent-ink:#FFFFFF; --accent-soft:#D3E6DE; --spore:#B8481A; --ok:#1F6E40; --ok-bg:#DCEFE2; --bad:#A3271D; --bad-bg:#F7DEDA; --hint:#7A4E00; --hint-bg:#F6E9C9;
  --hero1:#1E6A5A; --hero2:#C7531F;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --fs:1; --lh:1.55; --ls:0; --ws:0; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16120E; --surface:#211B15; --surface2:#2C251D; --ink:#EDE8D9; --muted:#B0A691; --line:#3E352A;
  --accent:#6FD3B6; --accent-ink:#0F2520; --accent-soft:#1F3A33; --spore:#F08A4B; --ok:#7FD69A; --ok-bg:#1C3324; --bad:#F08E80; --bad-bg:#3A1F1B; --hint:#F2C66B; --hint-bg:#3A2F17;
  --hero1:#164F43; --hero2:#8F3A15; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16120E; --surface:#211B15; --surface2:#2C251D; --ink:#EDE8D9; --muted:#B0A691; --line:#3E352A;
  --accent:#6FD3B6; --accent-ink:#0F2520; --accent-soft:#1F3A33; --spore:#F08A4B; --ok:#7FD69A; --ok-bg:#1C3324; --bad:#F08E80; --bad-bg:#3A1F1B; --hint:#F2C66B; --hint-bg:#3A2F17;
  --hero1:#164F43; --hero2:#8F3A15; color-scheme:dark }
:root[data-contrast="on"]{
  --bg:#000; --surface:#000; --surface2:#1C1C1C; --ink:#FFF; --muted:#F0F0F0; --line:#FFF;
  --accent:#FFD400; --accent-ink:#000; --accent-soft:#2B2600; --spore:#FFD400; --ok:#7CFF9B; --ok-bg:#002B0E; --bad:#FF8C8C; --bad-bg:#2B0000; --hint:#FFD400; --hint-bg:#1C1C1C;
  --hero1:#000; --hero2:#000; color-scheme:dark }
:root[data-font="lexend"]{ --f-body:"Lexend","Verdana",system-ui,sans-serif; --f-display:"Lexend","Verdana",system-ui,sans-serif }
:root[data-spacing="on"]{ --lh:1.95; --ls:.04em; --ws:.12em }
html{font-size:calc(16px * var(--fs));height:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);overflow:hidden}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--spore);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:0}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:99;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px}
.skip:focus{top:8px}

.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;overflow:clip}
.top{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.02rem;letter-spacing:.02em;display:block;line-height:1.1}
.brand span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.iconbtn{min-width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);min-height:56px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs button[aria-current="page"] svg{stroke-width:2.6}

.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.lead{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:38px;padding:7px 12px;font-size:.9rem}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:110px;resize:vertical}
label{font-weight:700;font-size:.92rem;display:block;margin-bottom:4px}
.field{display:flex;flex-direction:column}
.note{font-size:.86rem;color:var(--muted)}
.term{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:0 4px;border-radius:4px}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.go{background:var(--hint-bg);color:var(--spore)}
.tag.warn{background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.88rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;color:var(--muted);font-size:.9rem;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;min-height:38px}
.say svg{width:16px;height:16px}
.say[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.say.mini{padding:4px 8px;min-height:32px;font-size:.78rem}
table.cmp{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:4px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
table.cmp th{background:var(--surface2)}
.tablewrap{overflow-x:auto}

/* Início */
.hero{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2));display:flex;gap:14px;align-items:center;border:0;text-align:left;width:100%}
:root[data-contrast="on"] .hero{border:2px solid #fff}
.hero .ring{flex:none;width:76px;height:76px;position:relative}
.hero .ring svg.pr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hero .ring .av{position:absolute;inset:7px;border-radius:50%;overflow:hidden;background:#fff}
.hero h1{font-size:1.45rem;color:#fff}
.hero p{color:#F3EEE2;font-size:.92rem}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}
.cont{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.cont .art{width:64px;flex:none}
.carousel{position:relative}
.cur-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:flex-start;min-height:132px}
.cur-card .art{width:70px;flex:none}
.cur-nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px}
.tile .art{width:46px}
.tile b{font-family:var(--f-display);font-size:1rem;line-height:1.2}
.tile span{font-size:.82rem;color:var(--muted)}

/* Trilha */
.prog{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.trail{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:4px}
.trail::before{content:"";position:absolute;left:27px;top:24px;bottom:24px;border-left:3px dotted var(--line)}
.node{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;background:none;border:0;padding:0;width:100%}
.node .num{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:var(--surface);border:2px solid var(--line);z-index:1}
.node.done .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.node.next .num{border-color:var(--spore);color:var(--spore)}
.node .info{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.node .info>div{flex:1;min-width:0}
.node .info .art{width:54px;flex:none}
.node.next .info{border-color:var(--spore)}
.node h3{font-size:1.05rem;margin-top:4px}
.node .meta{font-size:.82rem;color:var(--muted);margin-top:2px}

/* Sheets */
.sheet{position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-head .t{flex:1;min-width:0}
.sheet-head .t b{display:block;font-family:var(--f-display);font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .t small{color:var(--muted);font-size:.8rem}
.steps{display:flex;gap:3px;margin-top:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-foot{display:flex;gap:10px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.step-kind{display:flex;align-items:center;gap:8px}
.step-kind .dot{width:10px;height:10px;border-radius:50%;background:var(--spore)}

/* História */
.story{display:flex;flex-direction:column;gap:14px}
.story .scene{width:110px;align-self:center}
.para{font-size:1.07rem;line-height:calc(var(--lh) + .1);max-width:64ch}
.para-wrap{display:flex;flex-direction:column;gap:6px}
.pause{border:2px solid var(--spore);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.pause .eyebrow{color:var(--spore)}
.pause h3{font-family:var(--f-body);font-size:1.05rem;font-weight:700}

/* Conceitos */
.concept .art{width:120px;height:120px;margin-bottom:4px}
.concept h2{font-size:1.6rem;margin-bottom:10px}
.concept p{font-size:1.06rem;max-width:64ch}
.words{display:flex;flex-direction:column;gap:10px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.word b{font-family:var(--f-display);font-size:1.15rem;color:var(--accent)}
.tl{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;border-left:2px solid var(--line)}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-20px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl-item.br::before{border-color:var(--spore)}
.tl-item.am::before{border-color:var(--ok);background:var(--ok)}
.tl-year{font-family:var(--f-display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.curio{border-radius:18px;padding:18px;background:var(--hint-bg);display:flex;flex-direction:column;gap:10px}
.curio .art{width:96px}
.lap{border:2px dashed var(--spore);border-radius:var(--r);padding:16px;background:var(--surface)}
.lap h3{color:var(--spore);font-size:1.15rem;margin-bottom:6px}
.lap ul,.prat ol,.prat ul{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.warnbox{background:var(--bad-bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.95rem}
.warnbox b{color:var(--bad)}

/* Exercícios */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.ex .kind{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ex h3{font-family:var(--f-body);font-size:1.03rem;font-weight:700}
.opt{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
.opt .mk{flex:none;width:22px;font-weight:800}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:10px;padding:10px 12px;font-size:.95rem}
.fb.ok{background:var(--ok-bg)}
.fb.no{background:var(--bad-bg)}
.fb b{display:block}
.vfrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.vfrow p{flex:1 1 200px;min-width:0}
.vfbtns{display:flex;gap:6px}
.vfbtns button{width:48px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:800}
.vfbtns button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mark{font-weight:800}
.mark.ok{color:var(--ok)} .mark.no{color:var(--bad)}
.assoc-row{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;border-top:1px solid var(--line);padding-top:8px}
.lac{line-height:2.4}
.lac select{width:auto;min-height:38px;padding:4px 8px;display:inline-block;max-width:100%}
.ordlist{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.ordlist li{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.ordlist li span{flex:1;min-width:0}
.ordlist li .n{flex:none;font-weight:800;color:var(--muted);width:22px}
.ordlist li button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.ordlist li.right{border-color:var(--ok);background:var(--ok-bg)}
.ordlist li.wrong{border-color:var(--bad);background:var(--bad-bg)}
.model{background:var(--accent-soft);border-radius:10px;padding:10px 12px}

/* Micoteca */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.spc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.ph{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface2)}
.ph svg,.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spc b{font-family:var(--f-display);font-size:.98rem;line-height:1.2}
.spc i{font-size:.8rem;color:var(--muted)}
.ficha .ph{border-radius:16px;aspect-ratio:4/3}
.credit{font-size:.75rem;color:var(--muted);margin-top:4px}
.taxo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.taxo div{padding:8px 12px;border-top:1px solid var(--line)}
.taxo div:nth-child(-n+2){border-top:0}
.taxo .k{background:var(--surface2);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.taxo .v{background:var(--surface)}
.fg-list{display:flex;flex-direction:column;gap:10px}
.fg-item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.fg-item .thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;flex:none;background:var(--surface2)}
.fg-item .thumb img{width:100%;height:100%;object-fit:cover}
.fg-item>div{flex:1;min-width:0}
.preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--surface2)}
.keyopt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:50px}

/* Batista */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .say{margin-top:8px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.mode.on{background:var(--ok-bg);color:var(--ok)}
.portrait{width:64px;height:64px;flex:none;border-radius:50%;overflow:hidden}

/* Perfil e login */
.phero{border-radius:22px;padding:22px 18px;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
:root[data-contrast="on"] .phero{border:2px solid #fff}
.phero .big{width:120px;height:120px;position:relative}
.phero .big svg.pr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.phero .big .av{position:absolute;inset:9px;border-radius:50%;overflow:hidden;background:#fff}
.phero h1{font-size:1.6rem;color:#fff}
.phero p{color:#F3EEE2}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.84rem;color:var(--muted)}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.avbtn{border:3px solid transparent;border-radius:50%;padding:0;background:none;aspect-ratio:1;overflow:hidden;max-width:100%}
.avbtn[aria-pressed="true"]{border-color:var(--spore)}
.avbtn svg,.avbtn img{width:100%;height:100%;display:block;object-fit:cover}
.login-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.login-hero img{width:84px;height:84px;border-radius:20px}
.prov{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;font-weight:700}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.confirm{background:var(--hint-bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.setrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow>div{min-width:0}
.switch{width:54px;height:32px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:25px;background:var(--accent-ink)}
.sizebtns{display:flex;gap:6px}
.sizebtns button{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.mapwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.prop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.prop .c{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:3px 9px;border-radius:8px}
.prop .l{font-style:italic;color:var(--muted)}
.prop .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;min-width:40px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:700;max-width:90%;text-align:center}
.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:translateY(6px);opacity:.3}100%{transform:none;opacity:1}}
:root[data-motion="off"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
