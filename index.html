<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Aplicativo educacional sobre fungos amazônicos para o 1º ano do Ensino Médio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Micoverso">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Micoverso Amazônico</title>
<meta name="theme-color" content="#1E6A5A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: app de coluna única tipo celular — cabeçalho fino, conteúdo rolável, barra de abas inferior; encontros ligados por uma "hifa" */
:root{
  --bg:#EDEFE4; --surface:#F9FAF3; --surface2:#E1E6D3; --ink:#2A2117; --muted:#625C4D; --line:#CBD1BB;
  --accent:#1E6A5A; --accent-ink:#FFFFFF; --accent-soft:#D3E6DE; --spore:#C7531F; --ok:#2B7A4B; --bad:#B0352A; --hint:#8A5A00; --hint-bg:#F6E9C9;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16120E; --surface:#211B15; --surface2:#2C251D; --ink:#EDE8D9; --muted:#A99F8B; --line:#3B3329;
  --accent:#6FD3B6; --accent-ink:#0F2520; --accent-soft:#1F3A33; --spore:#F08A4B; --ok:#6CCB8C; --bad:#EE7B6C; --hint:#F2C66B; --hint-bg:#3A2F17; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16120E; --surface:#211B15; --surface2:#2C251D; --ink:#EDE8D9; --muted:#A99F8B; --line:#3B3329;
  --accent:#6FD3B6; --accent-ink:#0F2520; --accent-soft:#1F3A33; --spore:#F08A4B; --ok:#6CCB8C; --bad:#EE7B6C; --hint:#F2C66B; --hint-bg:#3A2F17; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;background:var(--bg);position:relative}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;flex-direction:column;flex:1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.brand span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.lead{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
label{font-weight:700;font-size:.9rem}

/* Trilha */
.hello{display:flex;gap:14px;align-items:center}
.hello .av{width:64px;height:64px;flex:none}
.prog{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.trail{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:4px}
.trail::before{content:"";position:absolute;left:27px;top:24px;bottom:24px;border-left:3px dotted var(--line)}
.node{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;background:none;border:0;padding:0;width:100%}
.node .num{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:var(--surface);border:2px solid var(--line);z-index:1}
.node.done .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.node.next .num{border-color:var(--spore);color:var(--spore)}
.node .info{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.node.next .info{border-color:var(--spore)}
.node h3{font-size:1.05rem}
.node .meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.go{background:var(--hint-bg);color:var(--spore)}

/* Sheet (missão) */
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet-head .t{flex:1;min-width:0}
.sheet-head .t b{display:block;font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .t small{color:var(--muted)}
.steps{display:flex;gap:4px;margin-top:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
.sheet-body{flex:1;overflow-y:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-foot{display:flex;gap:10px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.narr{display:flex;flex-direction:column;gap:16px}
.speech{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:16px 18px;font-size:1.08rem;line-height:1.6}
.guide{display:flex;gap:12px;align-items:center}
.guide svg{width:56px;height:56px;flex:none}
.concept h2{font-size:1.6rem;margin-bottom:10px}
.concept .art{width:120px;height:120px;margin-bottom:6px}
.concept p{font-size:1.06rem;max-width:62ch}
.term{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:0 4px;border-radius:4px}
.lap{border:2px dashed var(--spore);border-radius:var(--r);padding:16px;background:var(--surface)}
.lap h3{color:var(--spore);font-size:1.15rem;margin-bottom:6px}
.lap ul{margin:8px 0 0;padding-left:20px}

/* Quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.q h3{font-family:var(--f-body);font-size:1.05rem;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.opt.right{border-color:var(--ok);background:var(--accent-soft);font-weight:700}
.opt.wrong{border-color:var(--bad);text-decoration:line-through;color:var(--muted)}
.hintbox{background:var(--hint-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.95rem}
.hintbox b{color:var(--hint)}
.expl{font-size:.95rem;color:var(--muted)}
.earn{font-weight:700;color:var(--spore)}

/* Micoteca */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.spc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.spc svg{width:100%;height:auto;aspect-ratio:1;max-width:100%}
.spc b{font-family:var(--f-display);font-size:1rem;line-height:1.2}
.spc i{font-size:.82rem;color:var(--muted)}
.ficha .art{width:160px;height:160px;margin:0 auto}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.ficha dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding-top:2px}
.ficha dd{margin:0;min-width:0}

/* Classificar */
.card-big{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:22px;text-align:center;font-family:var(--f-display);font-size:1.4rem;font-weight:800}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bin{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 10px;font-weight:700}
.bin:hover{border-color:var(--accent)}
.fb{border-radius:12px;padding:12px 14px}
.fb.ok{background:var(--accent-soft)}
.fb.no{background:var(--hint-bg)}

/* Mapa */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.prop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.prop .c{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:3px 9px;border-radius:8px}
.prop .l{font-style:italic;color:var(--muted)}
.prop .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:1.2rem;line-height:1}
.mapwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}

/* MicoIA */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0}
.note{font-size:.84rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.8rem}
.badge.off{opacity:.4}
.badge svg{width:40px;height:40px}
.confirm{background:var(--hint-bg);border-radius:12px;padding:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>MICOVERSO AMAZÔNICO</b><span>Fungos da nossa floresta</span></div>
    <span class="pill" id="sporePill" title="Esporos coletados"></span>
    <button class="iconbtn" id="profBtn" aria-label="Perfil e sobre o aplicativo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" aria-label="Seções">
    <button data-tab="trilha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 17c6 0 2-9 8-10" stroke-dasharray="2 2.5"/></svg>Trilha</button>
    <button data-tab="micoteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 6 0 0 1 18 0z"/><path d="M10 12v6a2 2 0 0 0 4 0v-6"/></svg>Micoteca</button>
    <button data-tab="desafios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>Desafios</button>
    <button data-tab="micoia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5M12 14.5h.01" stroke-linecap="round"/></svg>Dúvidas</button>
    <button data-tab="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="16" width="7" height="5" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><path d="M10 5.5h4M17.5 8v8"/></svg>Mapa</button>
  </nav>
  <section class="sheet" id="sheet" hidden></section>
</div>

<script>
/* ============ DADOS ============ */
const MISSIONS = [
 {id:"m1", title:"Que ser é esse?", sub:"O Reino Fungi", badge:"Hifa",
  narr:"Choveu forte à tarde em Salvaterra. No quintal, sobre um tronco caído de mangueira, apareceram umas orelhinhas alaranjadas. Sua avó olha e diz: “é orelha-de-pau, nasce depois da chuva”. Mas afinal… isso é planta, é bicho ou é outra coisa? Eu sou a Micélia, e vou ser sua guia no Micoverso Amazônico. Bora descobrir?",
  cards:[
   {art:"orelha", h:"Um reino só deles", p:"Fungos formam o <span class='term'>Reino Fungi</span>, separado das plantas e dos animais. Estudos de DNA mostram que os fungos são parentes mais próximos dos animais do que das plantas."},
   {art:"enzima", h:"Comem por fora", p:"Fungos não fazem fotossíntese: são <span class='term'>heterotróficos</span>. Eles liberam enzimas no ambiente, digerem a matéria ali mesmo e depois <span class='term'>absorvem</span> os nutrientes."},
   {art:"quitina", h:"Parede de quitina", p:"Suas células têm parede celular de <span class='term'>quitina</span>, o mesmo material da casca do caranguejo e do corpo dos insetos. Guardam energia como <span class='term'>glicogênio</span>, igual a nós."},
   {art:"hifa", h:"Hifas e micélio", p:"O corpo da maioria dos fungos é feito de filamentos microscópicos, as <span class='term'>hifas</span>. O conjunto de hifas forma o <span class='term'>micélio</span>, uma rede que cresce escondida no solo, na madeira e nas folhas."},
   {art:"levedura", h:"Uma célula ou muitas", p:"As <span class='term'>leveduras</span>, como o fermento de pão, são unicelulares. Bolores, orelhas-de-pau e cogumelos são pluricelulares."}
  ],
  lap:{t:"Dobra 1 · Que reino é esse?", items:["Cole a etiqueta “Reino Fungi” na capa da dobra.","Escreva 3 diferenças entre fungos e plantas.","Desenhe uma hifa e um micélio e escreva o nome de cada um."]},
  map:"inicial"},
 {id:"m2", title:"Nuvem de esporos", sub:"Estrutura e reprodução", badge:"Esporo",
  narr:"Você chuta sem querer um cogumelo velho no caminho da escola e sobe uma fumacinha marrom. Não é poeira, não! São milhões de esporos saindo para viajar com o vento. Cada um pode virar um fungo novo. Vamos ver como isso funciona?",
  cards:[
   {art:"cogumelo", h:"O cogumelo é o “fruto”", p:"O que a gente vê sobre o tronco é o <span class='term'>corpo de frutificação</span>, a parte que produz esporos. Ele tem <span class='term'>píleo</span> (chapéu), <span class='term'>lamelas</span> ou poros embaixo e <span class='term'>estipe</span> (o “pé”). O fungo de verdade continua no micélio."},
   {art:"esporo", h:"Esporos viajantes", p:"<span class='term'>Esporos</span> são microscópicos e leves. Vento, água da chuva e animais carregam esses esporos. Ao cair num lugar úmido e com alimento, o esporo germina e forma novas hifas."},
   {art:"levedura", h:"Reprodução assexuada", p:"Sem mistura de material genético: esporos formados por mitose, <span class='term'>brotamento</span> nas leveduras (uma célula nova “brota” da mãe) e <span class='term'>fragmentação</span> de pedaços de hifa."},
   {art:"hifa", h:"Reprodução sexuada", p:"Hifas de dois fungos compatíveis se fundem. Depois ocorre meiose e se formam esporos com nova combinação de genes. Isso aumenta a variedade da espécie."}
  ],
  lap:{t:"Bolso 2 · Ciclo de vida", items:["Desenhe em sequência: esporo → hifa → micélio → corpo de frutificação.","Prática: deixe o chapéu de um cogumelo sobre papel por uma noite e cole a impressão de esporos (lave as mãos depois)."]}},
 {id:"m3", title:"Três potes na mesa", sub:"Diversidade dos fungos", badge:"Basídio",
  narr:"A professora trouxe três potes para a sala: um pão com manchas verdes, um pacotinho de fermento e uma orelha-de-pau. Ela pergunta: “Quem aqui é fungo?”. A turma se divide. E você, o que acha?",
  cards:[
   {art:"levedura", h:"Leveduras", p:"Fungos unicelulares. A <span class='term'>Saccharomyces cerevisiae</span>, o fermento, faz <span class='term'>fermentação</span>: transforma açúcar em gás carbônico (que faz o pão crescer) e álcool."},
   {art:"bolor", h:"Bolores", p:"Fungos de hifas que formam manchas aveludadas em pão, frutas e paredes úmidas. O mofo preto do pão (<i>Rhizopus</i>) e o verde-azulado (<i>Penicillium</i>) são exemplos."},
   {art:"orelha", h:"Cogumelos e orelhas-de-pau", p:"Pertencem aos <span class='term'>basidiomicetos</span>: formam esporos em células chamadas basídios. São os fungos mais fáceis de ver na mata."},
   {art:"taca", h:"Fungos de taça", p:"Os <span class='term'>ascomicetos</span> formam esporos dentro de “saquinhos” (ascos). Na Amazônia, a taça-peluda (<i>Cookeina</i>) cresce em galhos caídos. Leveduras e <i>Penicillium</i> também são ascomicetos."},
   {art:"liquen", h:"Liquens", p:"Um <span class='term'>líquen</span> é a parceria entre um fungo e uma alga ou cianobactéria. A alga faz fotossíntese; o fungo dá abrigo e umidade. Juntos, vivem em troncos e pedras."}
  ],
  lap:{t:"Aba 3 · Formas de vida", items:["Recorte as etiquetas: levedura, bolor, cogumelo, orelha-de-pau, líquen.","Cole cada uma no grupo certo e escreva um exemplo do seu dia a dia."]}},
 {id:"m4", title:"A teia escondida", sub:"Fungos na floresta amazônica", badge:"Micorriza",

/* ============ MISSÃO ============ */
let speaking=false;
function speak(text,btn){
  try{
    const ss=window.speechSynthesis; if(!ss){btn.textContent="Áudio indisponível";btn.disabled=true;return}
    if(speaking){ss.cancel();speaking=false;btn.textContent="▶ Ouvir narração";return}
    const u=new SpeechSynthesisUtterance(text.replace(/[“”]/g,"")); u.lang="pt-BR"; u.rate=0.98;
    const vs=ss.getVoices(); const pv=vs.find(x=>/pt[-_]BR/i.test(x.lang))||vs.find(x=>/^pt/i.test(x.lang)); if(pv) u.voice=pv;
    u.onend=()=>{speaking=false;btn.textContent="▶ Ouvir narração"};
    ss.cancel(); ss.speak(u); speaking=true; btn.textContent="■ Parar narração";
  }catch(e){btn.textContent="Áudio indisponível";btn.disabled=true}
}
function stopSpeak(){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){} speaking=false}

function missionSteps(m){
  const st=[{k:"narr"}]; m.cards.forEach(c=>st.push({k:"card",c}));
  let qs = m.quizMix ? ["q2","q5","q8","q11","q13","q15"].map(id=>QUESTIONS.find(q=>q.id===id)) : QUESTIONS.filter(q=>q.m===m.id);
  st.push({k:"quiz",qs,ctx:m.quizMix?"final":"m"});
  if(m.map) st.push({k:"map",mode:m.map});
  st.push({k:"lap"}); st.push({k:"end"}); return st;
}
function openMission(id){
  const m=MISSIONS.find(x=>x.id===id), steps=missionSteps(m); let i=0;
  const sh=$("#sheet"); sh.hidden=false;
  function draw(){
    stopSpeak();
    const s=steps[i], idx=MISSIONS.indexOf(m)+1;
    let body="";
    if(s.k==="narr") body=`<div class="narr pop"><p class="eyebrow">Encontro ${idx} · Narrativa</p><h2 style="font-size:1.7rem">${esc(m.title)}</h2><div class="guide">${MICELIA}<b>Micélia</b></div><div class="speech">${esc(m.narr)}</div><button class="btn ghost" id="sayBtn" style="align-self:flex-start">▶ Ouvir narração</button></div>`;
    else if(s.k==="card") body=`<div class="concept pop"><div class="art">${art(s.c.art)}</div><p class="eyebrow">Conceito</p><h2>${esc(s.c.h)}</h2><p>${s.c.p}</p></div>`;
    else if(s.k==="quiz") body=`<div class="stack pop"><div><p class="eyebrow">${s.ctx==="final"?"Desafio final":"Desafio do encontro"}</p><h2 style="font-size:1.5rem">Teste o que aprendeu</h2><p class="lead">Acertou de primeira: +10 esporos. Com dica: +5.</p></div><div class="stack" id="qList"></div></div>`;
    else if(s.k==="map") body=`<div class="stack pop"><div><p class="eyebrow">Mapa conceitual ${s.mode}</p><h2 style="font-size:1.5rem">${s.mode==="inicial"?"O que você já sabe?":"O que você sabe agora?"}</h2><p class="lead">${s.mode==="inicial"?"Ligue conceitos com palavras de ligação. Não tem certo nem errado: é o seu ponto de partida.":"Monte de novo seu mapa e compare com o do 1º encontro."}</p></div><div id="mapHost"></div></div>`;
    else if(s.k==="lap") body=`<div class="stack pop"><p class="eyebrow">Hora do lapbook</p><div class="lap"><h3>${esc(m.lap.t)}</h3><p>Registre no seu lapbook físico:</p><ul>${m.lap.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><p class="note">Use as etiquetas recortáveis entregues pela professora.</p></div>`;
    else body=`<div class="stack pop" style="align-items:center;text-align:center;padding-top:20px"><div style="width:110px">${badgeSvg(true)}</div><p class="eyebrow">Selo conquistado</p><h2 style="font-size:1.8rem">${esc(m.badge)}</h2><p class="lead">${S.done[m.id]?"Você já tinha concluído este encontro.":"+20 esporos por concluir o encontro."}</p></div>`;
    sh.innerHTML = `<div class="sheet-head"><button class="iconbtn" id="closeM" aria-label="Fechar encontro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="t"><b>${esc(m.title)}</b><small>Encontro ${idx} · passo ${i+1} de ${steps.length}</small><div class="steps">${steps.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div></div></div>
     <div class="sheet-body" id="sb">${body}</div>
     <div class="sheet-foot"><button class="btn ghost" id="prevB" ${i===0?"disabled":""}>Voltar</button><button class="btn" id="nextB">${s.k==="end"?"Voltar à trilha":"Continuar"}</button></div>`;
    $("#sb").scrollTop=0;
    $("#closeM").onclick=close;
    $("#prevB").onclick=()=>{if(i>0){i--;draw()}};
    $("#nextB").onclick=()=>{ if(s.k==="end"){close();return} i++; if(steps[i].k==="end"&&!S.done[m.id]){S.done[m.id]=true;award(20)} draw(); };
    if(s.k==="narr") $("#sayBtn").onclick=e=>speak(m.narr,e.currentTarget);
    if(s.k==="quiz"){const L=$("#qList"); s.qs.forEach(q=>L.appendChild(quizCard(q,s.ctx==="final"?"final":"m")))}
    if(s.k==="map") mapBuilder($("#mapHost"),s.mode);
  }
  function close(){stopSpeak(); sh.hidden=true; sh.innerHTML=""; setTab(tab)}
  draw();
}

/* ============ QUIZ COM DICA ============ */
function quizCard(q,ctx){
  const key=ctx+":"+q.id, el=document.createElement("div"); el.className="q";
  const order = q.o.map((t,i)=>i); // embaralha de forma estável por pergunta
  order.sort((a,b)=>((a*7+q.id.length*3)%5)-((b*7+q.id.length*3)%5));
  function draw(){
    const res=S.ans[key]; const t=tries[key]||0;
    el.innerHTML=`<h3>${esc(q.q)}</h3>${order.map(i=>{let cls="opt"; if(res!==undefined&&i===q.a) cls+=" right"; if((tries[key+"w"]||[]).includes(i)) cls+=" wrong"; return `<button class="${cls}" data-i="${i}" ${res!==undefined?"disabled":""}>${esc(q.o[i])}</button>`}).join("")}
     ${res===undefined&&t===1?`<div class="hintbox"><b>Dica:</b> ${esc(q.h)}</div>`:""}
     ${res!==undefined?`<p class="expl">${res>0?`<span class="earn">+${res} esporos.</span> `:"Resposta certa destacada. "}${esc(q.e)}</p>`:""}`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(i===q.a){const pts=t===0?10:5; S.ans[key]=pts; award(pts)}
      else { tries[key+"w"]=(tries[key+"w"]||[]).concat(i); if(t===0){tries[key]=1} else {S.ans[key]=0; save()} }
      draw();
    });
  }
  draw(); return el;
}

   ${CLASS_ROUNDS.map(r=>`<button class="box" data-c="${r.id}" style="text-align:left;display:flex;gap:14px;align-items:center"><div style="width:60px;flex:none">${art(r.id==="c1"?"levedura":"micorriza")}</div><div style="min-width:0"><h3>Classifique: ${esc(r.t)}</h3><p class="meta lead">${S.cls[r.id]!==undefined?`Melhor resultado: ${S.cls[r.id]} de ${r.items.length}`:`${r.items.length} cartas · ${r.bins.join(" / ")}`}</p></div></button>`).join("")}</div>`;
  $("#dq").onclick=()=>{dMode="quiz";viewDesafios(v)};
  v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{dMode=b.dataset.c;viewDesafios(v)});

function classGame(v,r){
  let deck=r.items.map((x,i)=>i).sort(()=>Math.random()-.5), k=0, hits=0, fb=null;
  function draw(){
    if(k>=deck.length){ const best=Math.max(S.cls[r.id]||0,hits); S.cls[r.id]=best; save();
      v.innerHTML=`<div class="stack" style="text-align:center;align-items:center;padding-top:20px"><div style="width:110px">${badgeSvg(hits>=r.items.length-1)}</div><h1 style="font-size:1.8rem">${hits} de ${r.items.length}</h1><p class="lead">${hits===r.items.length?"Classificação perfeita!":"Revise as cartas que errou e tente de novo."}</p><div class="row" style="justify-content:center"><button class="btn" id="again">Jogar de novo</button><button class="btn ghost" id="bk">Desafios</button></div></div>`;
      $("#again").onclick=()=>classGame(v,r); $("#bk").onclick=()=>{dMode=null;viewDesafios(v)}; return; }
    const it=r.items[deck[k]];
    v.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><button class="btn ghost" id="bk">← Sair</button><span class="pill">${k+1} / ${deck.length}</span></div>
      <p class="eyebrow">Classifique: ${esc(r.t)}</p><div class="card-big pop">${esc(it[0])}</div>
      ${fb?`<div class="fb ${fb.ok?"ok":"no"}"><b>${fb.ok?"Acertou! +2 esporos.":"Ops! Era “"+esc(r.bins[it[1]])+"”."}</b> ${esc(it[2])}</div><button class="btn" id="nx">Próxima carta</button>`
          :`<div class="bins">${r.bins.map((b,i)=>`<button class="bin" data-b="${i}">${esc(b)}</button>`).join("")}</div>`}</div>`;
    $("#bk").onclick=()=>{dMode=null;viewDesafios(v)};
    if(fb) $("#nx").onclick=()=>{fb=null;k++;draw()};
    else v.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{const ok=+b.dataset.b===it[1]; if(ok){hits++;award(2)} fb={ok}; draw()});
  }
  draw();
}

function uniq(list){const s=new Set(); list.forEach(p=>{s.add(p[0]);s.add(p[2])}); return s.size}
function mapBuilder(host,mode,onChange){

  function draw(){
    const L=S.maps[mode];
    host.innerHTML=`<div class="stack" style="gap:12px"><form class="box stack" id="pf" style="gap:10px">
      <div><label for="ca">Conceito</label><select id="ca">${opts}</select></div>
      <div><label for="lk">Palavra de ligação</label><input type="text" id="lk" list="lkl" placeholder="ex.: são, formam, vivem em" maxlength="30" autocomplete="off"><datalist id="lkl">${LINKS.map(l=>`<option value="${esc(l)}">`).join("")}</datalist></div>
      <div><label for="cb">Conceito</label><select id="cb">${opts}</select></div>
      <button class="btn">Adicionar ligação</button></form>
      ${L.length?mapSvg(L):`<p class="note">Seu mapa ${mode} ainda está vazio. Comece por “Fungos”.</p>`}
      <div class="stack" style="gap:8px">${L.map((p,i)=>`<div class="prop"><span class="c">${esc(p[0])}</span><span class="l">${esc(p[1])}</span><span class="c">${esc(p[2])}</span><button class="x" data-del="${i}" aria-label="Remover ligação">×</button></div>`).join("")}</div>
      ${L.length?`<button class="btn ghost" id="cp" style="align-self:flex-start">Copiar para o lapbook</button>`:""}</div>`;
    host.querySelector("#cb").selectedIndex=5;
    host.querySelector("#pf").onsubmit=e=>{e.preventDefault(); const a=host.querySelector("#ca").value,b=host.querySelector("#cb").value,l=host.querySelector("#lk").value.trim();
      if(!l||a===b){host.querySelector("#lk").placeholder=a===b?"Escolha dois conceitos diferentes":"Escreva a palavra de ligação";host.querySelector("#lk").focus();return}
      S.maps[mode].push([a,l,b]); save(); onChange?onChange():draw()};
    host.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.maps[mode].splice(+b.dataset.del,1);save();onChange?onChange():draw()});
    const cp=host.querySelector("#cp"); if(cp) cp.onclick=async()=>{const txt=L.map(p=>`${p[0]} — ${p[1]} → ${p[2]}`).join("\n"); try{await navigator.clipboard.writeText(txt);cp.textContent="Copiado"}catch(e){cp.textContent="Não foi possível copiar"}};
  }
  draw();
}
function mapSvg(L){
  const nodes=[]; L.forEach(p=>{[p[0],p[2]].forEach(c=>{if(!nodes.includes(c))nodes.push(c)})});
  const n=nodes.length, W=520, H=Math.max(300,n*28+120), cx=W/2, cy=H/2, R=Math.min(W,H)/2-50;
  const pos={}; nodes.forEach((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/n; pos[c]=[cx+Math.cos(a)*(n>1?R:0), cy+Math.sin(a)*(n>1?R:0)]});
  const edges=L.map(p=>{const [x1,y1]=pos[p[0]],[x2,y2]=pos[p[2]];const mx=(x1+x2)/2,my=(y1+y2)/2;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text x="${mx}" y="${my-4}" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)" style="paint-order:stroke" stroke="var(--surface)" stroke-width="4">${esc(p[1])}</text>`}).join("");
  const ns=nodes.map(c=>{const [x,y]=pos[c];const w=Math.max(60,c.length*7.4+18);return `<rect x="${x-w/2}" y="${y-15}" width="${w}" height="30" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent)">${esc(c)}</text>`}).join("");
  return `<div class="mapwrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" style="display:block;max-width:none;min-width:100%" font-family="Atkinson Hyperlegible, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>${edges}${ns}</svg></div>`;
}

/* ============ DÚVIDAS (offline) ============ */
const FAQ=[
 ["Por que os cogumelos aparecem depois da chuva?","O micélio fica escondido no solo ou na madeira o tempo todo. Quando chove, ele absorve muita água e consegue inflar rapidamente o corpo de frutificação, o cogumelo. A umidade também ajuda os esporos a germinar. Por isso, depois das chuvas do Marajó, os troncos se enchem de orelhas-de-pau."],
 ["Orelha-de-pau é planta?","Não. É um fungo basidiomiceto. Ela não tem clorofila, não faz fotossíntese e se alimenta decompondo a madeira morta onde cresce."],
 ["Como as saúvas cultivam fungos?","As saúvas cortam folhas, levam para o ninho, picam e usam como adubo para um fungo, o Leucoagaricus gongylophorus. O fungo cresce sobre esse material e serve de alimento para a colônia. Formigas e fungo dependem um do outro: é mutualismo."],
 ["O que é a vassoura-de-bruxa do cacau?","É uma doença causada pelo fungo Moniliophthora perniciosa, nativo da Amazônia. Ele infecta ramos e frutos do cacaueiro e do cupuaçuzeiro, que incham e secam, parecendo uma vassoura velha. Causa grandes prejuízos aos agricultores."],
 ["Fungo é bicho ou planta?","Nenhum dos dois. Fungos formam um reino próprio, o Reino Fungi. Pelo DNA, são mais aparentados com os animais do que com as plantas."],
 ["Posso comer cogumelo que nasce no quintal?","Não coma sem identificação feita por especialista. Muitos cogumelos tóxicos parecem inofensivos, e cor, cheiro ou cozimento não garantem segurança."],
 ["Mofo é fungo?","Sim. Mofo, ou bolor, é um fungo formado por hifas que cresce sobre alimentos, papel e paredes úmidas. As manchas coloridas são os esporos."],
 ["Por que o pão cresce?","O fermento é uma levedura, um fungo unicelular. Ela faz fermentação: consome o açúcar da massa e libera gás carbônico, que forma bolhas e faz o pão crescer."],
 ["Fungo faz bem ou mal?","Os dois. Fungos decompõem a matéria morta, fazem parceria com raízes, dão origem a alimentos e remédios como a penicilina. Mas alguns causam micoses em pessoas e doenças em plantações."],
 ["O que é micélio?","É a rede de filamentos (hifas) que forma o corpo do fungo. Fica escondida no solo, na madeira ou nas folhas e pode ocupar uma área enorme."],
 ["Como os fungos se espalham?","Por esporos: estruturas microscópicas e leves levadas pelo vento, pela água da chuva e por animais. Ao cair em lugar úmido e com alimento, o esporo germina."],
 ["Existe fungo que brilha?","Sim. Alguns fungos, como espécies de Mycena, produzem luz verde por uma reação química: é a bioluminescência. Dá para ver na mata escura."],
 ["O que é líquen?","É uma parceria entre um fungo e uma alga ou cianobactéria. A alga produz alimento pela fotossíntese e o fungo oferece abrigo e umidade."],
 ["O que são micorrizas?","São associações entre fungos e raízes de plantas. O fungo ajuda a planta a absorver água e fósforo, e a planta fornece açúcares ao fungo."],
 ["Como evitar micose?","Seque bem os pés e entre os dedos, use chinelo em banheiros coletivos, não divida toalhas e troque roupas úmidas. Se aparecer mancha ou coceira persistente, procure um posto de saúde."]
];
let faqQ="";
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function viewIA(v){
  const words=norm(faqQ).split(/\s+/).filter(w=>w.length>2);
  const list=FAQ.filter(f=>!words.length||words.some(w=>norm(f[0]+" "+f[1]).includes(w)));
  v.innerHTML=`<div class="stack"><div class="hello"><div class="av" style="width:52px;height:52px">${MICELIA}</div><div style="min-width:0"><p class="eyebrow">Pergunte à Micélia</p><h1 style="font-size:1.4rem">Dúvidas sobre fungos</h1></div></div>
   <input type="text" id="fq" placeholder="Busque: chuva, saúva, mofo, pão…" value="${esc(faqQ)}" aria-label="Buscar dúvida" autocomplete="off">
   <div class="stack" style="gap:10px" id="fl">${list.length?list.map(f=>`<details class="box"><summary style="font-weight:700;cursor:pointer">${esc(f[0])}</summary><p style="margin-top:8px">${esc(f[1])}</p></details>`).join(""):`<p class="note">Nenhuma resposta encontrada. Anote sua dúvida no lapbook e leve para a professora.</p>`}</div>
   <p class="note">Não achou sua dúvida? Anote no bolso de perguntas do lapbook para discutir no próximo encontro.</p></div>`;
  const i=$("#fq"); i.oninput=()=>{faqQ=i.value; const p=i.selectionStart; viewIA(v); const n=$("#fq"); n.focus(); n.setSelectionRange(p,p)};
}

function badgeSvg(on){return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="${on?"var(--accent-soft)":"var(--surface2)"}" stroke="${on?"var(--accent)":"var(--line)"}" stroke-width="3" stroke-dasharray="5 3"/><path d="M18 36q14-24 28 0z" fill="${on?"var(--spore)":"var(--line)"}"/><path d="M29 36h6v12h-6z" fill="${on?"var(--ink)":"var(--line)"}" opacity=".7"/></svg>`}
function openProfile(){
  const sh=$("#sheet"); sh.hidden=false; let confirming=false;
  function draw(){
    sh.innerHTML=`<div class="sheet-head"><button class="iconbtn" id="closeP" aria-label="Fechar perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="t"><b>Seu perfil</b><small>Progresso salvo neste aparelho</small></div></div>
    <div class="sheet-body"><div class="stack">
     <div class="box stack" style="gap:10px"><label for="pn">Nome</label><div class="ask"><input type="text" id="pn" value="${esc(S.name)}" maxlength="30" autocomplete="off"><button class="btn" id="sv">Salvar</button></div></div>
     <div class="stats"><div class="stat"><b>${S.spores}</b><span>esporos coletados</span></div><div class="stat"><b>${MISSIONS.filter(m=>S.done[m.id]).length}/6</b><span>encontros concluídos</span></div></div>
     <div><p class="eyebrow" style="margin-bottom:8px">Selos</p><div class="badges">${MISSIONS.map(m=>`<div class="badge ${S.done[m.id]?"":"off"}">${badgeSvg(!!S.done[m.id])}<div>${esc(m.badge)}</div></div>`).join("")}</div></div>
     <div class="box"><p class="eyebrow" style="margin-bottom:6px">Sobre o aplicativo</p><p><b>MICOVERSO AMAZÔNICO</b> é o produto educacional da pesquisa de mestrado “Ensino de Micologia na Educação Básica: Desenvolvimento e Validação de um Artefato Pedagógico Digital Interativo Baseado em Inteligência Artificial sobre a Biodiversidade Fúngica Amazônica” (PPGEECA/UEPA).</p><p style="margin-top:8px">Autora: Jéssica Batista de Assunção · Orientador: Prof. Dr. Alcindo da Silva Martins Junior.<br>Público: 1º ano do Ensino Médio · E.E.E.M. Salomão Matos, Salvaterra, Marajó (PA).</p><p class="note" style="margin-top:8px">Usado junto com o lapbook físico, em 6 encontros.</p></div>
     ${confirming?`<div class="confirm stack" style="gap:10px"><p><b>Apagar todo o progresso deste aparelho?</b> Esporos, selos, respostas e mapas serão perdidos.</p><div class="row"><button class="btn" id="yes" style="background:var(--bad);color:#fff">Apagar tudo</button><button class="btn ghost" id="no">Cancelar</button></div></div>`
      :`<button class="btn ghost" id="rst">Recomeçar do zero</button>`}
    </div></div>`;
    $("#closeP").onclick=()=>{sh.hidden=true;sh.innerHTML="";setTab(tab)};
    $("#sv").onclick=()=>{S.name=$("#pn").value.trim();save();$("#sv").textContent="Salvo"};
    if(confirming){$("#yes").onclick=()=>{S={name:"",spores:0,done:{},ans:{},maps:{inicial:[],final:[]},cls:{}};save();confirming=false;draw()};$("#no").onclick=()=>{confirming=false;draw()}}
    else $("#rst").onclick=()=>{confirming=true;draw()};
  }
  draw();
}

renderPill(); setTab("trilha");
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
